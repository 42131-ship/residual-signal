; 导出预设 —— 入库，能被 diff、能被 CI 读到。
;
; 两条预设：Windows 是玩家包，Android 是手机包（2026-11-26 加，见 design/MOBILE.md）。
; 两者都用 **Godot 4.7.2** 的导出模板：本机 %APPDATA%\Godot\export_templates 只有 4.5.2 / 4.7.2，
; 没有 4.7.0。跑门禁仍用 .tools/Godot_v4.7-stable_*；导出用 .tools/Godot_v4.7.2-stable_*。
;
; Android 用**模板 APK**（use_gradle_build=false）：不必装 Gradle，只需要 JDK 17 + Android SDK。
; 签名：debug 走 %APPDATA%\Godot\keystores\debug.keystore（口令 android）；
; release 的 keystore 不入库（见 .gitignore 的 *.keystore），用环境变量注入。

